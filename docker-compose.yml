services:
  app:
    build: .
    image: voshod:0.0.1-SNAPSHOT
    ports:
      - "8080:8080"
    environment:
      MAIN_DATASOURCE_URL: jdbc:hsqldb:file:/app/.jmix/hsqldb/vshd1
      ONEC_WEB_BASE_URL: ${ONEC_WEB_BASE_URL:-}
      ONEC_WEB_USERNAME: ${ONEC_WEB_USERNAME:-}
      ONEC_WEB_PASSWORD: ${ONEC_WEB_PASSWORD:-}
      ONEC_WEB_ORGANIZATION_KEY: ${ONEC_WEB_ORGANIZATION_KEY:-c1405bb8-2942-11e5-874a-001e101f4da1}
    volumes:
      - voshod-data:/app/.jmix
    restart: unless-stopped

volumes:
  voshod-data:
